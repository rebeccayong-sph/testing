<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Page Not Found | Awedio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      /* Brand tokens (from Figma variables) */
      --bg: #f6f7fd;
      --harmony-700: #232b69;
      --aw-100: #e9ebfc;
      --btn-primary: #1d2fba;
      --text: #1a1a23;
      --page-text: #121212;

      /* Radio surface */
      --stage: #d8d8da;
      --alert-strong: #c83c39;
      --muted: #55555c;
      --hole: #cfcfd2;
      --hl: rgba(255, 255, 255, .95);
      --sh: rgba(62, 62, 70, .28);
    }

    *, *::before, *::after { box-sizing: border-box; }
    * { margin: 0; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      background: var(--bg); color: var(--text);
      font-family: Montserrat, "Helvetica Neue", Arial, sans-serif;
      min-height: 100vh; display: flex; flex-direction: column;
      -webkit-font-smoothing: antialiased;
    }
    img { display: block; max-width: 100%; }
    button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
    :focus-visible { outline: 2px solid var(--btn-primary); outline-offset: 2px; }

    /* ---------- Top bar ---------- */
    .top-bar {
      background: var(--harmony-700);
      min-height: 35.5px;
      padding: 8px 116px;
      display: flex; align-items: center;
    }
    .top-bar__content { display: flex; align-items: center; gap: 8px; min-width: 0; }
    .top-bar__logo { width: 58.137px; height: 19.5px; flex: none; }
    .top-bar__divider { width: 1.246px; height: 13.104px; flex: none; }
    .top-bar__text { font-size: 12px; font-weight: 500; line-height: 18px; color: #fff; min-width: 0; }

    /* ---------- Navigation ---------- */
    .nav {
      background: #fff; height: 69px; padding: 16px 100px;
      display: flex; align-items: flex-end;
      overflow-x: auto; scrollbar-width: none;
    }
    .nav::-webkit-scrollbar { display: none; }
    .nav__list { list-style: none; padding: 0; display: flex; gap: 4px; height: 100%; align-items: center; }
    .nav__item {
      display: flex; align-items: center; gap: 8px;
      height: 37px; padding: 8px 16px; border-radius: 8px;
      color: var(--text); text-decoration: none;
      font-weight: 500; font-size: 16px; line-height: 1.2; white-space: nowrap;
      transition: background-color .15s ease;
    }
    .nav__item:hover { background: var(--aw-100); }
    .nav__item--active { background: var(--aw-100); color: var(--btn-primary); }
    .nav__item img { width: 16px; height: 16px; transition: transform .15s ease; }
    .nav__item[aria-expanded="true"] img { transform: rotate(180deg); }

    /* ---------- Stage ---------- */
    .main { flex: 1; background: var(--stage); padding: 48px 16px 64px; display: flex; flex-direction: column; align-items: center; }
    .width { width: 100%; max-width: 1280px; display: flex; flex-direction: column; align-items: center; }
    .lead { font-weight: 600; font-size: 32px; line-height: 38px; text-align: center; color: var(--page-text); }

    /* ---------- Neumorphic radio ----------
       Sized in --u (1u = 1px on a 1700px panel) so it scales as one object. */
    .radio { container-type: inline-size; width: min(100%, 1100px); }
    .panel {
      --u: calc(100cqw / 1700);
      position: relative; aspect-ratio: 1700 / 912;
      border-radius: calc(var(--u) * 28);
    }

    /* Display — layout/text from Figma node 10642:4787 (1px ≈ 1.29u),
       surface is the grey recessed panel. */
    .display {
      position: absolute; left: calc(var(--u) * 432); top: calc(var(--u) * 83);
      width: calc(var(--u) * 836);
      display: flex; flex-direction: column; gap: calc(var(--u) * 21);
      padding: calc(var(--u) * 31);
      border-radius: calc(var(--u) * 42);
      border: calc(var(--u) * 2) solid rgba(255, 255, 255, .75);
      background: linear-gradient(180deg, #d1d1d4, #d8d8da);
      box-shadow:
        inset 0 calc(var(--u) * 3) calc(var(--u) * 6) rgba(62, 62, 70, .22),
        inset 0 calc(var(--u) * -2) calc(var(--u) * 3) rgba(255, 255, 255, .8),
        0 calc(var(--u) * 2) calc(var(--u) * 2) rgba(255, 255, 255, .9);
    }
    .display::before {
      content: ""; position: absolute; inset: calc(var(--u) * 4);
      border-radius: calc(var(--u) * 38); border: 1px solid rgba(112, 112, 120, .25); pointer-events: none;
    }
    .display__title {
      display: flex; align-items: flex-start; justify-content: space-between; gap: calc(var(--u) * 21);
      font-weight: 600; font-size: calc(var(--u) * 32); line-height: calc(var(--u) * 38);
      color: var(--alert-strong); white-space: nowrap;
    }
    .display__title > * { font: inherit; }
    .display__divider { width: 100%; height: 1px; }
    .display__status {
      font-weight: 600; font-size: 20px; line-height: 24px; /* fixed size, doesn't scale with the radio */
      color: var(--page-text); white-space: nowrap; text-align: center;
    }

    .grill {
      position: absolute; top: calc(var(--u) * 377); display: grid;
      grid-template-columns: repeat(9, calc(var(--u) * 30)); gap: calc(var(--u) * 16.2) calc(var(--u) * 16.25);
    }
    .grill.l { left: calc(var(--u) * 68); }
    .grill.r { left: calc(var(--u) * 1231); }
    .grill i {
      width: calc(var(--u) * 30); height: calc(var(--u) * 30); border-radius: 50%; background: var(--hole);
      box-shadow: inset calc(var(--u) * 2) calc(var(--u) * 3) calc(var(--u) * 4) var(--sh), calc(var(--u) * 1) calc(var(--u) * 2) calc(var(--u) * 2) var(--hl);
    }

    .dial {
      position: absolute; left: calc(var(--u) * 595); top: calc(var(--u) * 330);
      width: calc(var(--u) * 510); aspect-ratio: 1; border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #e4e4e6, #d8d8da 70%);
      box-shadow:
        calc(var(--u) * 10) calc(var(--u) * 16) calc(var(--u) * 26) rgba(56, 56, 64, .28),
        calc(var(--u) * -10) calc(var(--u) * -12) calc(var(--u) * 24) var(--hl),
        inset 0 calc(var(--u) * 2) calc(var(--u) * 2) rgba(255, 255, 255, .8);
    }
    .dial { cursor: crosshair; touch-action: none; -webkit-user-select: none; user-select: none; }
    .dial:focus-visible { outline: 2px solid var(--btn-primary); outline-offset: 6px; }
    /* Grows 50% from the middle of its flat edge, so it stays seated on ring a */
    .dial__station { transform-box: fill-box; transform-origin: 50% 100%; transition: transform .2s ease; }
    .dial__station.is-on { transform: scale(1.5); }
    .dial__station, .dial.is-tuned { cursor: pointer; } /* anywhere in a station's snap zone links to it */
    .dial svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
    .dial text { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-weight: 500; fill: #2e2e34; font-size: 21px; text-anchor: middle; dominant-baseline: middle; }
    .ring { pointer-events: none; position: absolute; border-radius: 50%; left: 50%; top: 50%; transform: translate(-50%, -50%); box-shadow: 0 1px 1px rgba(255, 255, 255, .9), inset 0 1px 1px rgba(255, 255, 255, .9); }
    .ring.a { width: 72%; height: 72%; border: 1px solid rgba(104, 104, 112, .35); }
    .ring.b { width: 62.5%; height: 62.5%; border: 1px solid rgba(104, 104, 112, .3); }
    .ring.c { width: 52%; height: 52%; border: 1px solid rgba(104, 104, 112, .25); }
    .knob {
      position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
      width: 47.5%; height: 47.5%; border-radius: 50%;
      background: radial-gradient(circle at 38% 28%, #f4f4f5 0%, #e5e5e7 45%, #d5d5d8 100%);
      box-shadow:
        calc(var(--u) * 5) calc(var(--u) * 9) calc(var(--u) * 12) rgba(56, 56, 64, .3),
        calc(var(--u) * -3) calc(var(--u) * -4) calc(var(--u) * 8) rgba(255, 255, 255, .9),
        inset calc(var(--u) * -4) calc(var(--u) * -8) calc(var(--u) * 14) rgba(84, 84, 92, .14);
    }

    /* ---------- Footer ---------- */
    .footer { background: #fff; padding: 40px 16px; display: flex; justify-content: center; }
    .footer p { width: 100%; max-width: 1296px; padding: 0 16px; font-size: 12px; line-height: 1.5; }

    /* ---------- Portrait radio on narrow containers ---------- */
    @container (max-width: 760px) {
      .panel {
        --u: calc(100cqw / 400); aspect-ratio: auto; border-radius: calc(var(--u) * 22);
        padding: calc(var(--u) * 28) 0 calc(var(--u) * 24);
        display: grid; justify-items: center; row-gap: calc(var(--u) * 28);
        grid-template-columns: 1fr 1fr; align-content: start;
      }
      .grill { position: static; }
      .dial { position: relative; left: auto; top: auto; order: 1; grid-column: 1 / -1; width: calc(var(--u) * 290); }
      .display {
        position: relative; left: auto; top: auto; grid-column: 1 / -1;
        width: calc(var(--u) * 348); gap: calc(var(--u) * 14);
        padding: calc(var(--u) * 19); border-radius: calc(var(--u) * 24);
      }
      .display::before { border-radius: calc(var(--u) * 21); }
      .display__title { font-size: calc(var(--u) * 23); line-height: calc(var(--u) * 28); }
      .grill { order: 2; grid-template-columns: repeat(9, calc(var(--u) * 11)); gap: calc(var(--u) * 6); }
      .grill.l { justify-self: end; margin-right: calc(var(--u) * 14); }
      .grill.r { justify-self: start; margin-left: calc(var(--u) * 14); }
      .grill i { width: calc(var(--u) * 11); height: calc(var(--u) * 11); }
      .grill i:nth-child(n+37) { display: none; }
    }

    @media (max-width: 1280px) {
      .top-bar { padding-left: 48px; padding-right: 48px; }
      .nav { padding-left: 32px; padding-right: 32px; }
    }
    @media (max-width: 900px) {
      .top-bar { padding: 8px 16px; }
      .nav { padding: 16px; }
      .main { padding: 32px 16px 40px; }
      .lead { font-size: 22px; line-height: 28px; }
    }
    @media (max-width: 767px) {
      .nav { padding: 12px 8px; height: auto; }
      .nav__item { padding: 8px 12px; font-size: 15px; }
      .footer { padding: 24px 16px; }
      .footer p { padding: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; }
    }
  </style>
</head>
<body>
  <!-- Top bar -->
  <div class="top-bar">
    <div class="top-bar__content">
      <img class="top-bar__logo" src="assets/sph-primary.svg" alt="SPH Media" width="58.137" height="19.5" />
      <img class="top-bar__divider" src="assets/topbar-divider.svg" alt="" width="1.246" height="13.104" />
      <p class="top-bar__text">Awedio.sg is now part of the SPH Media website.</p>
    </div>
  </div>

  <!-- Navigation -->
  <nav class="nav" aria-label="Main">
    <ul class="nav__list">
      <li><a class="nav__item" href="/">Home</a></li>
      <li>
        <button class="nav__item nav__item--active" type="button" aria-expanded="false" aria-haspopup="true" id="stations-toggle">
          Stations
          <img src="assets/chevron-down.svg" alt="" width="16" height="16" />
        </button>
      </li>
      <li><a class="nav__item" href="/podcasts">Podcasts</a></li>
      <li><a class="nav__item" href="/videos">Videos</a></li>
    </ul>
  </nav>

  <main class="main">
    <div class="width">
      <h1 class="lead">You’ve tuned to a frequency that doesn’t exist.</h1>

      <div class="radio">
        <div class="panel">
          <div class="display">
            <div class="display__title">
              <h2>Page Not Found</h2>
              <p>404</p>
            </div>
            <img class="display__divider" src="assets/display-divider.svg" alt="" width="598" height="1" />
            <p class="display__status" id="display-status">Dead Air</p>
          </div>
          <div class="grill l" aria-hidden="true"></div>
          <div class="dial" id="dial" tabindex="0" role="slider" aria-label="Tuning dial. Find one of our stations, then press Enter to listen." aria-valuemin="88" aria-valuemax="108" aria-valuenow="98" aria-valuetext="98.0 MHz, dead air">
            <svg viewBox="-255 -255 510 510" id="scale"></svg>
            <div class="ring a"></div><div class="ring b"></div><div class="ring c"></div>
            <div class="knob"></div>
          </div>
          <div class="grill r" aria-hidden="true"></div>
        </div>
      </div>
    </div>
  </main>

  <footer class="footer">
    <p>Published by SPH Media Limited, Co. Regn. No. 202120748H. Copyright © 2025 SPH Media Limited. All rights reserved.</p>
  </footer>

  <script>
    // Stations dropdown toggle state (menu content is hidden in the design)
    document.getElementById('stations-toggle').addEventListener('click', function () {
      this.setAttribute('aria-expanded', String(this.getAttribute('aria-expanded') !== 'true'));
    });

    // Speaker grille holes
    document.querySelectorAll('.grill').forEach(function (g) { g.innerHTML = '<i></i>'.repeat(90); });

    // Dial scale
    var svg = document.getElementById('scale');
    var NS = 'http://www.w3.org/2000/svg';
    var el = function (n, a, t) {
      var e = document.createElementNS(NS, n);
      for (var k in a) e.setAttribute(k, a[k]);
      if (t) e.textContent = t;
      return e;
    };
    // FM band 88–108 MHz printed over a 270° arc (13.5° per MHz).
    // The 90° gap at the bottom is off the band (dead air).
    var F_MIN = 88, F_MAX = 108, SWEEP = 270;
    var angleOf = function (f) { return (f - F_MIN) / (F_MAX - F_MIN) * SWEEP - SWEEP / 2; };
    var freqOf = function (a) { return F_MIN + (a + SWEEP / 2) / SWEEP * (F_MAX - F_MIN); };
    // Labels in the lower half are flipped so they read upright
    var label = function (text, a) {
      var t = 'rotate(' + a + ')' + (Math.abs(a) > 90 ? ' rotate(180 0 -222)' : '');
      return el('text', { x: 0, y: -222, transform: t }, text);
    };

    // Ticks every 0.2 MHz, long tick on each whole MHz
    for (var i = 0; i <= (F_MAX - F_MIN) * 5; i++) {
      var long = i % 5 === 0;
      svg.appendChild(el('line', { x1: 0, y1: -(long ? 162 : 166), x2: 0, y2: -172, transform: 'rotate(' + angleOf(F_MIN + i / 5) + ')', stroke: long ? '#6b6b72' : '#8e8e95', 'stroke-width': long ? 1.2 : .8 }));
    }
    // Numbers every 2 MHz
    for (var f = F_MIN; f <= F_MAX; f += 2) svg.appendChild(label(String(f), angleOf(f)));

    // Stations: tuning the needle onto one shows its name in the display
    var STATIONS = [
      { f: 89.9,  name: 'Money FM 89.9', color: '#009640', url: 'https://audio.sph.com.sg/moneyfm893/' },
      { f: 91.3,  name: 'One FM 91.3',   color: '#EE3B31', url: 'https://audio.sph.com.sg/onefm913/' },
      { f: 92,    name: 'Kiss92 FM',     color: '#C93093', url: 'https://audio.sph.com.sg/kiss92/' },
      { f: 96.3,  name: '96.3好FM',      color: '#00A9AC', url: 'https://audio.sph.com.sg/963haofm/' },
      { f: 100.3, name: 'UFM 100.3',     color: '#00AECA', url: 'https://audio.sph.com.sg/ufm1003/' }
    ];
    // Snap zone: the needle locks on once it is within 30% of the gap to the
    // neighbouring station on that side (edge stations reuse their inner gap).
    var SNAP = 0.3;
    // 16px semi-circle whose flat edge sits on the outer edge of .ring.a (72% of the 510-unit dial)
    var DOT_R = 8, SCALE_R = 510 * 0.72 / 2;
    STATIONS.forEach(function (st, i) {
      var prev = STATIONS[i - 1], next = STATIONS[i + 1];
      var gapLo = prev ? st.f - prev.f : next.f - st.f;
      var gapHi = next ? next.f - st.f : st.f - prev.f;
      st.lo = st.f - gapLo * SNAP;
      st.hi = st.f + gapHi * SNAP;
      // Rotation lives on a wrapper <g> so CSS can scale the marker itself
      var g = el('g', { transform: 'rotate(' + angleOf(st.f) + ')' });
      st.dot = el('path', {
        class: 'dial__station', fill: st.color,
        d: 'M' + -DOT_R + ' ' + -SCALE_R + 'A' + DOT_R + ' ' + DOT_R + ' 0 0 1 ' + DOT_R + ' ' + -SCALE_R + 'Z'
      });
      st.dot.station = st;
      g.appendChild(st.dot);
      svg.appendChild(g);
    });

    // Red tuner needle; on landing it rests mid-dial at 98 MHz (no station → Dead Air)
    var REST_F = 98, REST = angleOf(REST_F);
    var needle = el('g', { transform: 'rotate(' + REST + ')' });
    needle.appendChild(el('line', { x1: 0, y1: -126, x2: 0, y2: -205, stroke: 'rgba(56,56,64,.25)', 'stroke-width': 3, transform: 'translate(1.5 2)' }));
    needle.appendChild(el('line', { x1: 0, y1: -126, x2: 0, y2: -205, stroke: '#c0392b', 'stroke-width': 2.5, 'stroke-linecap': 'round' }));
    svg.appendChild(needle);

    // ---------- Tuning ----------
    var dial = document.getElementById('dial');
    var statusEl = document.getElementById('display-status');
    var DEAD_AIR = statusEl.textContent;
    var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var current = REST, target = REST, freq = REST_F, raf = 0, tuned = null;

    function stationAt(f) {
      if (f == null) return null;
      for (var i = 0; i < STATIONS.length; i++) if (f >= STATIONS[i].lo && f <= STATIONS[i].hi) return STATIONS[i];
      return null;
    }

    // f = frequency in MHz, or null when the needle is in the off-band gap
    function tune(f, angle) {
      freq = f;
      var st = stationAt(f);
      target = st ? angleOf(st.f) : (angle != null ? angle : (f == null ? REST : angleOf(f)));
      statusEl.textContent = st ? st.name : DEAD_AIR;
      STATIONS.forEach(function (s) { s.dot.classList.toggle('is-on', s === st); });
      tuned = st;
      dial.classList.toggle('is-tuned', !!st);
      dial.setAttribute('aria-valuenow', f == null ? F_MIN : f.toFixed(1));
      dial.setAttribute('aria-valuetext', st ? st.name : (f == null ? 'off band, dead air' : f.toFixed(1) + ' MHz, dead air'));
      if (!raf) raf = requestAnimationFrame(step);
    }

    function step() {
      var d = ((target - current + 540) % 360) - 180; // shortest way round
      current = reduceMotion || Math.abs(d) < .05 ? target : current + d * .25;
      needle.setAttribute('transform', 'rotate(' + current + ')');
      raf = current === target ? 0 : requestAnimationFrame(step);
    }

    // Pointer → angle from the dial centre (0° = top, clockwise)
    function fromPointer(e) {
      var r = dial.getBoundingClientRect();
      var dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
      if (Math.hypot(dx, dy) < r.width * .12) return; // too close to the centre to read an angle
      var a = Math.atan2(dx, -dy) * 180 / Math.PI;
      if (Math.abs(a) <= SWEEP / 2) tune(freqOf(a));
      else tune(null, a); // in the gap below the band: dead air
    }

    // Mouse: the needle follows the cursor; leaving the dial returns it to 98 MHz.
    // Touch/pen: drag around the dial; the needle stays where it is released.
    dial.addEventListener('pointermove', function (e) {
      if (e.pointerType === 'mouse' || dial.hasPointerCapture(e.pointerId)) fromPointer(e);
    });
    dial.addEventListener('pointerdown', function (e) {
      // Taps that start on a station marker aren't captured, so the marker gets its click
      if (e.pointerType !== 'mouse' && !e.target.closest('.dial__station')) { dial.setPointerCapture(e.pointerId); fromPointer(e); }
    });
    // Click: a station marker always opens its station. With a mouse, so does clicking
    // anywhere while the needle is snapped to a station (the hand-cursor area).
    // Touch/pen taps only open a station from its marker, so dragging the needle never navigates.
    dial.addEventListener('click', function (e) {
      var marker = e.target.closest('.dial__station');
      var st = marker ? marker.station : (e.pointerType === 'touch' || e.pointerType === 'pen' ? null : tuned);
      if (st) window.location.href = st.url;
    });
    dial.addEventListener('pointerleave', function (e) {
      if (e.pointerType === 'mouse') tune(REST_F);
    });

    // Keyboard: arrows nudge 0.1 MHz, Page Up/Down jump between stations, Escape returns to 98 MHz
    dial.addEventListener('keydown', function (e) {
      var base = freq; // the dial's actual position, not the station it has snapped to
      var next;
      switch (e.key) {
        case 'ArrowRight': case 'ArrowUp':   next = base == null ? F_MIN : Math.min(F_MAX, base + .1); break;
        case 'ArrowLeft':  case 'ArrowDown': next = base == null ? F_MAX : Math.max(F_MIN, base - .1); break;
        case 'PageUp':   next = (STATIONS.filter(function (s) { return base == null || s.f > base + 1e-9; })[0] || STATIONS[0]).f; break;
        case 'PageDown': next = (STATIONS.slice().reverse().filter(function (s) { return base == null || s.f < base - 1e-9; })[0] || STATIONS[STATIONS.length - 1]).f; break;
        case 'Home': next = F_MIN; break;
        case 'End':  next = F_MAX; break;
        case 'Escape': tune(REST_F); e.preventDefault(); return;
        case 'Enter': { var st = stationAt(base); if (st) window.location.href = st.url; return; }
        default: return;
      }
      e.preventDefault();
      tune(Math.round(next * 10) / 10);
    });
  </script>
</body>
</html>
